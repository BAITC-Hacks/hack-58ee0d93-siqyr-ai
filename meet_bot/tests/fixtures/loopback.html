<!doctype html><html><head><meta charset="utf-8"><title>Siqyr audio loopback</title></head>
<body><button id="start">Start 3-second test tone</button><output id="status"></output>
<script>
document.querySelector('#start').onclick = async () => {
  const audio = new AudioContext();
  const source = audio.createOscillator();
  const destination = audio.createMediaStreamDestination();
  source.frequency.value = 440;
  source.connect(destination);
  source.start();
  const sender = new RTCPeerConnection();
  const receiver = new RTCPeerConnection();
  sender.onicecandidate = e => e.candidate && receiver.addIceCandidate(e.candidate);
  receiver.onicecandidate = e => e.candidate && sender.addIceCandidate(e.candidate);
  sender.addTrack(destination.stream.getAudioTracks()[0], destination.stream);
  const offer = await sender.createOffer();
  await sender.setLocalDescription(offer);
  await receiver.setRemoteDescription(offer);
  const answer = await receiver.createAnswer();
  await receiver.setLocalDescription(answer);
  await sender.setRemoteDescription(answer);
  window.testPeers = [sender, receiver];
  document.querySelector('#status').textContent = 'running';
  setTimeout(() => {
    source.stop(); sender.close(); receiver.close(); audio.close();
    document.querySelector('#status').textContent = 'done';
  }, 3000);
};
</script></body></html>
