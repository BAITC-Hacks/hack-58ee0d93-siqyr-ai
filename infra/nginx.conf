# Фронт и API на одном адресе: браузеру не нужен CORS, порт API наружу не открыт.

# В журнал идёт путь без query string: токен /api/runs/{id}/events?token=... не должен оставаться в логах.
log_format siqyr '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log siqyr;

    # Точный лимит записи — MAX_UPLOAD_MB в API (413 с понятным текстом); здесь только верхняя граница.
    client_max_body_size 1g;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        # Docker DNS с коротким кэшем: после перезапуска api nginx находит новый адрес контейнера.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Перезаписываем, а не дополняем: лимиты API считаются по реальному адресу, подделать его нельзя.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE хода обработки и загрузка записей идут потоком, без буфера nginx.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
